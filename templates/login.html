{% extends "base.html" %}
{% block title %}Sign In · SpendSense AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5 col-lg-4">
    <div class="panel shadow-sm p-4">
      <div class="text-center mb-4">
        <span class="eyebrow">SPENDSENSE AI</span>
        <h2 class="fw-bold mt-1 mb-1">Sign In</h2>
        <p class="text-secondary small">Access your personal expense dashboard</p>
      </div>

      <form method="post">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-secondary">Password</label>
          <input type="password" class="form-control" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button class="btn btn-primary w-100 rounded-pill py-2 fw-semibold" type="submit">
          Sign In
        </button>
      </form>

      <div class="text-center mt-4 small text-secondary">
        Don't have an account yet? <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Create Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
